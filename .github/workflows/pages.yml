name: Build and publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          git ls-files | grep -v -E '^(\.github/|_build/|README\.md$)' | while read -r f; do
            mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"
          done

      - name: Generate downloadable files (PDF, DOCX, ICS, CSV, ZIP) and og-image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core >/dev/null || true
          pip install --quiet python-docx
          OUT_DIR=_site/files python3 _build/make_files.py
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1200,630 --screenshot=_site/assets/img/og-image.png "file://$PWD/_build/og.html"
          ls -la _site _site/files _site/assets/img

      - name: Publish _site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy site from ${{ github.sha }}"
